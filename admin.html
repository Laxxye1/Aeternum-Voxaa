<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeternum Voxaa - Admin</title>
    <style>
        @font-face { font-family: 'TeutonNormal'; src: url('/fonts/TeutonNormal.otf') format('opentype'); font-display: swap; }
        :root { --biru: #0F52BA; --bg: #f0f4f8; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'TeutonNormal', sans-serif; }
        body { background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: #fff; border-radius: 20px; max-width: 420px; width: 100%; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .box h1 { font: bold 18px monospace; color: var(--biru); margin-bottom: 4px; }
        .box .sub { font-size: 12px; color: #999; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font: bold 11px sans-serif; color: #666; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
        .field input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #ddd; font-size: 14px; }
        .field .hint { font-size: 11px; color: #aaa; margin-top: 6px; }
        .btn-row { display: flex; gap: 8px; margin-top: 20px; }
        .btn { flex: 1; padding: 13px; border: none; border-radius: 12px; font: bold 13px sans-serif; cursor: pointer; }
        .btn-primary { background: var(--biru); color: #fff; }
        .btn-secondary { background: #f0f0f0; color: #555; }
        .status { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 12px; text-align: center; display: none; }
        .status.ok { display: block; background: #e6f7ee; color: #1a7a4c; }
        .status.fail { display: block; background: #fdeaea; color: #c0392b; }
        .status.loading { display: block; background: #eef2f7; color: #666; }
        .current { margin-top: 20px; padding: 14px; background: #f9fafb; border-radius: 12px; font-size: 12px; color: #555; word-break: break-all; }
        .current b { color: var(--biru); display: block; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
        .backup-section { margin-top: 24px; }
        .backup-section h2 { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
        .backup-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f9fafb; border-radius: 10px; margin-bottom: 6px; }
        .backup-item .info { font-size: 11px; color: #555; }
        .backup-item .info .name { font-weight: bold; color: #333; display: block; margin-bottom: 2px; }
        .backup-item a { font-size: 11px; color: var(--biru); font-weight: bold; text-decoration: none; padding: 6px 10px; background: #e3f2fd; border-radius: 8px; }
        .backup-empty { font-size: 12px; color: #999; text-align: center; padding: 14px; }
        .back-link { display: block; text-align: center; margin-top: 18px; font-size: 12px; color: var(--biru); text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>ᴀᴅᴍɪɴ</h1>

        <div class="field">
            <label>Alamat Server Backend</label>
            <input type="text" id="apiBaseInput" placeholder="https://domain-panel.com:port">
        </div>

        <div class="btn-row">
            <button class="btn btn-secondary" onclick="testConnection()">ᴛᴇsᴛ ᴋᴏɴᴇᴋsɪ</button>
            <button class="btn btn-primary" onclick="saveApiBase()">sɪᴍᴘᴀɴ</button>
        </div>

        <div class="status" id="statusBox"></div>

        <div class="current" id="currentBox" style="display:none">
            <b>Alamat Aktif Sekarang</b>
            <span id="currentValue"></span>
        </div>

        <div class="backup-section">
            <h2>ʙᴀᴄᴋᴜᴘ ғɪʟᴇ</h2>
            <div id="backupList"><div class="backup-empty">ᴍᴇᴍᴜᴀᴛ...</div></div>
        </div>

        <a class="back-link" href="/dashboard">Kembali ke Dashboard</a>
    </div>

    <script>
        let accessGranted = true;
        (function checkAccess() {
            let user = null;
            try { user = JSON.parse(localStorage.getItem('aeternum_user') || 'null'); } catch (e) {}
            if (!user || user.role !== 'owner') {
                accessGranted = false;
                document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center;font-family:sans-serif;color:#c0392b;font-weight:bold">ᴀᴋsᴇs ᴅɪᴛᴏʟᴀᴋ</div>';
                setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
            }
        })();
        function loadCurrent() {
            if (!accessGranted) return;
            const saved = localStorage.getItem('aeternum_api_base');
            const box = document.getElementById('currentBox');
            const val = document.getElementById('currentValue');
            if (saved) {
                box.style.display = 'block';
                val.textContent = saved;
                document.getElementById('apiBaseInput').value = saved;
            } else {
                box.style.display = 'block';
                val.textContent = '(belum diatur - menggunakan domain saat ini)';
            }
        }
        function normalizeUrl(url) {
            url = url.trim();
            if (!url) return '';
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            return url.replace(/\/+$/, '');
        }
        async function testConnection() {
            if (!accessGranted) return;
            const url = normalizeUrl(document.getElementById('apiBaseInput').value);
            const status = document.getElementById('statusBox');
            if (!url) { status.className = 'status fail'; status.textContent = 'ɪsɪ ᴀʟᴀᴍᴀᴛ ᴛᴇʀʟᴇʙɪʜ ᴅᴀʜᴜʟᴜ'; return; }
            status.className = 'status loading'; status.textContent = 'ᴍᴇɴɢᴇᴄᴇᴋ ᴋᴏɴᴇᴋsɪ...';
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 6000);
                const r = await fetch(url + '/api/status', { signal: controller.signal });
                clearTimeout(timeout);
                if (r.ok) { status.className = 'status ok'; status.textContent = 'ʙᴇʀʜᴀsɪʟ ᴛᴇʀʜᴜʙᴜɴɢ ᴋᴇ sᴇʀᴠᴇʀ'; }
                else { status.className = 'status fail'; status.textContent = 'sᴇʀᴠᴇʀ ᴍᴇʀᴇsᴘᴏɴ ᴛᴀᴘɪ ᴇʀʀᴏʀ (' + r.status + ')'; }
            } catch (e) {
                status.className = 'status fail'; status.textContent = 'ɢᴀɢᴀʟ ᴛᴇʀʜᴜʙᴜɴɢ, ᴄᴇᴋ ᴀʟᴀᴍᴀᴛ ᴀᴛᴀᴜ sᴇʀᴠᴇʀ';
            }
        }
        function saveApiBase() {
            if (!accessGranted) return;
            const url = normalizeUrl(document.getElementById('apiBaseInput').value);
            const status = document.getElementById('statusBox');
            if (!url) { status.className = 'status fail'; status.textContent = 'ɪsɪ ᴀʟᴀᴍᴀᴛ ᴛᴇʀʟᴇʙɪʜ ᴅᴀʜᴜʟᴜ'; return; }
            localStorage.setItem('aeternum_api_base', url);
            status.className = 'status ok'; status.textContent = 'ᴛᴇʀsɪᴍᴘᴀɴ, ʜᴀʟᴀᴍᴀɴ ʟᴀɪɴ ᴀᴋᴀɴ ᴍᴇɴɢɢᴜɴᴀᴋᴀɴ ᴀʟᴀᴍᴀᴛ ɪɴɪ';
            loadCurrent();
        }
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        function formatDate(iso) {
            const d = new Date(iso);
            return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }
        async function loadBackups() {
            if (!accessGranted) return;
            const list = document.getElementById('backupList');
            const apiBase = localStorage.getItem('aeternum_api_base') || '';
            if (!apiBase) { list.innerHTML = '<div class="backup-empty">ᴀᴛᴜʀ ᴀʟᴀᴍᴀᴛ sᴇʀᴠᴇʀ ᴛᴇʀʟᴇʙɪʜ ᴅᴀʜᴜʟᴜ</div>'; return; }
            try {
                const r = await fetch(apiBase + '/api/backup/list');
                const d = await r.json();
                if (d.error || !d.backups || !d.backups.length) { list.innerHTML = '<div class="backup-empty">ʙᴇʟᴜᴍ ᴀᴅᴀ ʙᴀᴄᴋᴜᴘ</div>'; return; }
                list.innerHTML = d.backups.map(b => `
                    <div class="backup-item">
                        <div class="info"><span class="name">${b.name}</span>${formatDate(b.created)} · ${formatSize(b.size)}</div>
                        <a href="${apiBase}/api/backup/download/${b.name}" target="_blank">ᴜɴᴅᴜʜ</a>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="backup-empty">ɢᴀɢᴀʟ ᴍᴇᴍᴜᴀᴛ ʙᴀᴄᴋᴜᴘ</div>';
            }
        }
        loadCurrent();
        loadBackups();
    </script>
</body>
</html>
