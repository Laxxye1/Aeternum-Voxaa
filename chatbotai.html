<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeternum Voxaa - AI</title>
    <style>
        :root { --biru: #0F52BA; --bg: #f0f4f8; --abu: #999; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { background: var(--bg); font-family: sans-serif; display: flex; flex-direction: column; }
        .topbar { background: var(--biru); padding: 16px; color: #fff; display: flex; align-items: center; gap: 12px; }
        .topbar-icon-btn { width: 32px; height: 32px; background: none; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; border-radius: 8px; }
        .topbar-icon-btn:active { background: rgba(255,255,255,0.1); }
        .topbar-icon-btn svg { width: 20px; height: 20px; fill: #fff; }
        .topbar h1 { font: bold 16px monospace; flex: 1; text-align: center; }
        .topbar-right { display: flex; align-items: center; gap: 4px; position: relative; }

        .dropdown-menu { display: none; position: absolute; top: 40px; right: 0; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); min-width: 160px; overflow: hidden; z-index: 200; }
        .dropdown-menu.active { display: block; }
        .dropdown-menu button { width: 100%; padding: 12px 16px; border: none; background: none; text-align: left; font: 13px sans-serif; color: #333; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .dropdown-menu button:active { background: #f0f4f8; }
        .dropdown-menu button svg { width: 16px; height: 16px; fill: #666; flex-shrink: 0; }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 500; }
        .sidebar-overlay.active { display: block; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; max-width: 80%; height: 100%; background: #fff; z-index: 501; transform: translateX(-100%); transition: transform 0.25s ease; display: flex; flex-direction: column; padding: 20px 16px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar h3 { font: bold 14px monospace; color: var(--biru); margin-bottom: 20px; }
        .sidebar button { text-align: left; padding: 12px 10px; border: none; background: none; font: 13px sans-serif; color: #333; cursor: pointer; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
        .sidebar button:active { background: #f0f4f8; }
        .sidebar button svg { width: 18px; height: 18px; fill: #666; flex-shrink: 0; }

        .chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 82%; padding: 12px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg.user { align-self: flex-end; background: var(--biru); color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background: #fff; color: #222; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .msg .md-h1 { font-size: 17px; font-weight: bold; margin: 8px 0 6px; color: var(--biru); }
        .msg .md-h2 { font-size: 15px; font-weight: bold; margin: 8px 0 6px; color: var(--biru); }
        .msg .md-h3 { font-size: 14px; font-weight: bold; margin: 6px 0 4px; }
        .msg .md-code { background: #f0f4f8; color: #c0392b; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .msg.ai.error { background: #fdeaea; color: #c0392b; }
        .msg img.attach { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
        .msg-actions { display: flex; gap: 6px; margin-top: 6px; align-self: flex-start; }
        .msg-actions button { border: none; background: transparent; color: var(--abu); font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
        .msg-actions button:active { background: rgba(0,0,0,0.05); }
        .msg-actions svg { width: 13px; height: 13px; fill: var(--abu); }
        .msg-wrap { display: flex; flex-direction: column; max-width: 82%; align-self: flex-start; }
        .msg-wrap .msg { max-width: 100%; align-self: flex-start; }
        .typing { align-self: flex-start; padding: 12px 16px; background: #fff; border-radius: 16px; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; background: var(--abu); border-radius: 50%; animation: blink 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--abu); text-align: center; padding: 20px; gap: 10px; }
        .empty-state svg { width: 48px; height: 48px; fill: var(--abu); }

        .input-bar { background: #fff; padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid #eee; position: sticky; bottom: 0; z-index: 10; }
        .input-bar textarea { flex: 1; resize: none; border: 1px solid #ddd; border-radius: 14px; padding: 10px 14px; font-size: 14px; font-family: sans-serif; max-height: 100px; min-height: 42px; line-height: 1.4; }
        .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #f0f4f8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--biru); }
        .send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--biru); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .send-btn svg { width: 20px; height: 20px; fill: #fff; }
        .preview-bar { padding: 8px 12px 0; display: flex; gap: 8px; background: #fff; }
        .preview-bar img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
        .preview-bar .remove { width: 20px; height: 20px; background: #c0392b; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; margin-left: -12px; margin-top: -6px; }
        .preview-bar .doc-chip { background: #e3f2fd; color: var(--biru); font: bold 11px sans-serif; padding: 8px 12px; border-radius: 10px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .attach-wrap { position: relative; }
        .attach-menu { display: none; position: absolute; bottom: 52px; left: 0; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); min-width: 170px; overflow: hidden; }
        .attach-menu.active { display: block; }
        .attach-menu button { width: 100%; padding: 12px 16px; border: none; background: none; text-align: left; font: 13px sans-serif; color: #333; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .attach-menu button:active { background: #f0f4f8; }
        .attach-menu button svg { width: 16px; height: 16px; fill: var(--biru); flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <h3>ᴀᴇᴛᴇʀɴᴜᴍ ᴠᴏxᴀᴀ</h3>
        <button onclick="window.location.href='/dashboard'">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Dashboard
        </button>
        <button onclick="window.location.href='/massage'">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg> Massage
        </button>
        <button onclick="window.location.href='/anime'">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-2z"/></svg> Anime
        </button>
    </div>

    <div class="topbar">
        <button class="topbar-icon-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <h1>ᴀᴇᴛᴇʀɴᴜᴍ ᴀɪ</h1>
        <div class="topbar-right">
            <button class="topbar-icon-btn" onclick="window.location.href='/dashboard'" title="Keluar">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
            <button class="topbar-icon-btn" onclick="toggleMenu()">
                <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z"/></svg>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <button onclick="clearChat()">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> ʜᴀᴘᴜs ᴏʙʀᴏʟᴀɴ
                </button>
            </div>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="empty-state" id="emptyState">
            <div>ᴍᴜʟᴀɪ ᴏʙʀᴏʟᴀɴ ᴅᴇɴɢᴀɴ ᴀɪ</div>
        </div>
    </div>

    <div class="preview-bar" id="previewBar" style="display:none"></div>

    <div class="input-bar">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.md,.json,.js,.html,.css,.py,.java,.c,.cpp,.doc,.docx" style="display:none" onchange="handleFileSelect(event)">
        <textarea id="msgInput" rows="1" placeholder="ᴋᴇᴛɪᴋ ᴘᴇsᴀɴ..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        const TUNNEL_URL_SOURCE = 'https://raw.githubusercontent.com/Laxxye1/Aeternum-Voxaa/main/tunnel-url.txt';
        let API_BASE = localStorage.getItem('aeternum_api_base') || '';
        let history = [];
        let pendingImage = null;

        async function initApiBase() {
            const manual = localStorage.getItem('aeternum_api_base');
            if (manual) { API_BASE = manual; return; }
            try {
                const r = await fetch(TUNNEL_URL_SOURCE + '?t=' + Date.now());
                if (r.ok) {
                    const text = (await r.text()).trim();
                    if (text.startsWith('https://')) API_BASE = text;
                }
            } catch (e) {}
        }
        const apiBaseReady = initApiBase();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }
        function clearChat() {
            history = [];
            lastUserPayload = null;
            document.getElementById('chatArea').innerHTML = '<div class="empty-state" id="emptyState"><div>ᴍᴜʟᴀɪ ᴏʙʀᴏʟᴀɴ ᴅᴇɴɢᴀɴ ᴀɪ</div></div>';
            document.getElementById('dropdownMenu').classList.remove('active');
        }
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdownMenu');
            const menuBtn = e.target.closest('.topbar-right');
            if (!menuBtn && menu.classList.contains('active')) menu.classList.remove('active');
        });

        let pendingDocument = null;
        const TEXT_EXTENSIONS = ['.txt', '.md', '.json', '.js', '.html', '.css', '.py', '.java', '.c', '.cpp'];

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const isImage = file.type.startsWith('image/');
            const isTextDoc = TEXT_EXTENSIONS.some(ext => file.name.toLowerCase().endsWith(ext));

            if (isImage) {
                const reader = new FileReader();
                reader.onload = () => {
                    pendingImage = reader.result;
                    pendingDocument = null;
                    const bar = document.getElementById('previewBar');
                    bar.style.display = 'flex';
                    bar.innerHTML = `<img src="${pendingImage}"><div class="remove" onclick="clearAttachment()">×</div>`;
                };
                reader.readAsDataURL(file);
            } else if (isTextDoc) {
                const reader = new FileReader();
                reader.onload = () => {
                    pendingDocument = { name: file.name, content: reader.result };
                    pendingImage = null;
                    const bar = document.getElementById('previewBar');
                    bar.style.display = 'flex';
                    bar.innerHTML = `<div class="doc-chip">${escapeHtml(file.name)}</div><div class="remove" onclick="clearAttachment()">×</div>`;
                };
                reader.readAsText(file);
            } else {
                alert('ᴛɪᴘᴇ ғɪʟᴇ ɪɴɪ ʙᴇʟᴜᴍ ᴅɪᴅᴜᴋᴜɴɢ ᴜɴᴛᴜᴋ ᴅɪʙᴀᴄᴀ ʟᴀɴɢsᴜɴɢ');
            }
        }
        function clearAttachment() {
            pendingImage = null;
            pendingDocument = null;
            document.getElementById('previewBar').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }
        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
        function renderMarkdown(text) {
            let safe = escapeHtml(text);
            safe = safe.replace(/^### (.+)$/gm, '<h3 class="md-h3">$1</h3>');
            safe = safe.replace(/^## (.+)$/gm, '<h2 class="md-h2">$1</h2>');
            safe = safe.replace(/^# (.+)$/gm, '<h1 class="md-h1">$1</h1>');
            safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            safe = safe.replace(/`([^`]+?)`/g, '<code class="md-code">$1</code>');
            safe = safe.replace(/\n/g, '<br>');
            return safe;
        }

        let lastUserPayload = null;

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.innerHTML;
                btn.innerHTML = 'ᴅɪsᴀʟɪɴ';
                setTimeout(() => { btn.innerHTML = original; }, 1500);
            }).catch(() => {});
        }

        function buildActions(text, wrap, download) {
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            const copyBtn = document.createElement('button');
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> ᴄᴏᴘʏ';
            copyBtn.onclick = () => copyText(text, copyBtn);
            const regenBtn = document.createElement('button');
            regenBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L14 11h7V4l-3.35 2.35z"/></svg> ᴜʟᴀɴɢɪ';
            regenBtn.onclick = () => regenerate();
            actions.appendChild(copyBtn);
            actions.appendChild(regenBtn);
            if (download && download.url) {
                const dlBtn = document.createElement('button');
                dlBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> ᴜɴᴅᴜʜ ' + escapeHtml(download.fileName || 'file');
                dlBtn.style.color = 'var(--biru)';
                dlBtn.onclick = () => { window.open(API_BASE + download.url, '_blank'); };
                actions.appendChild(dlBtn);
            }
            wrap.appendChild(actions);
        }

        function appendMessage(role, text, imageUrl) {
            document.getElementById('emptyState').style.display = 'none';
            const area = document.getElementById('chatArea');
            if (role === 'user') {
                const div = document.createElement('div');
                div.className = 'msg user';
                div.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
                if (imageUrl) {
                    const img = document.createElement('img');
                    img.src = imageUrl; img.className = 'attach';
                    div.appendChild(img);
                }
                area.appendChild(div);
                area.scrollTop = area.scrollHeight;
                return div;
            }
            const wrap = document.createElement('div');
            wrap.className = 'msg-wrap';
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = renderMarkdown(text);
            wrap.appendChild(div);
            if (!role.includes('error')) buildActions(text, wrap);
            area.appendChild(wrap);
            area.scrollTop = area.scrollHeight;
            return div;
        }
        function appendMessageTyped(role, text, download) {
            document.getElementById('emptyState').style.display = 'none';
            const area = document.getElementById('chatArea');
            const wrap = document.createElement('div');
            wrap.className = 'msg-wrap';
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            wrap.appendChild(div);
            area.appendChild(wrap);
            let i = 0;
            return new Promise((resolve) => {
                function typeNext() {
                    if (i <= text.length) {
                        div.innerHTML = renderMarkdown(text.slice(0, i));
                        area.scrollTop = area.scrollHeight;
                        i++;
                        setTimeout(typeNext, 15);
                    } else {
                        buildActions(text, wrap, download);
                        resolve();
                    }
                }
                typeNext();
            });
        }
        function showTyping() {
            const area = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'typing'; div.id = 'typingIndicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            let message = input.value.trim();
            if (!message && !pendingImage && !pendingDocument) return;

            const displayText = message || (pendingDocument ? `(dokumen: ${pendingDocument.name})` : '(gambar)');
            appendMessage('user', displayText, pendingImage);
            const imageToSend = pendingImage;
            const docToSend = pendingDocument;
            input.value = '';
            input.style.height = 'auto';
            clearAttachment();

            let finalMessage = message;
            if (docToSend) {
                finalMessage = `${message ? message + '\n\n' : ''}[Isi dokumen "${docToSend.name}"]:\n${docToSend.content}`;
            }

            lastUserPayload = { message: finalMessage, image: imageToSend };
            history.push({ role: 'user', content: displayText });
            await requestAI();
        }

        async function regenerate() {
            if (!lastUserPayload) return;
            if (history.length && history[history.length - 1].role === 'assistant') history.pop();
            await requestAI();
        }

        async function requestAI() {
            showTyping();
            try {
                await apiBaseReady;
                if (!API_BASE) { hideTyping(); appendMessage('ai error', 'sᴇʀᴠᴇʀ ᴛɪᴅᴀᴋ ᴛᴇʀʜᴜʙᴜɴɢ'); return; }
                const r = await fetch(API_BASE + '/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: lastUserPayload.message, image: lastUserPayload.image, history: history.slice(0, -1) })
                });
                const d = await r.json();
                hideTyping();
                if (d.error) {
                    appendMessage('ai error', d.error);
                } else {
                    await appendMessageTyped('ai', d.reply, d.download);
                    history.push({ role: 'assistant', content: d.reply });
                    if (history.length > 20) history = history.slice(-20);
                }
            } catch (e) {
                hideTyping();
                appendMessage('ai error', 'ɢᴀɢᴀʟ ᴛᴇʀʜᴜʙᴜɴɢ ᴋᴇ sᴇʀᴠᴇʀ');
            }
        }

        document.getElementById('msgInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
    </script>
</body>
</html>
